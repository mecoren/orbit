# =============================================================================
# orbit-flutter — 移动端 FRB 桥接薄壳（omnipass omni-flutter 同款）
# 职责：将 orbit-core 公共 API 包装为 flutter_rust_bridge 可导出函数，不含业务逻辑。
# 与桌面壳 apps/desktop/src-tauri 的 #[tauri::command] 面一一对应。
# 状态管理：无 Tauri Manager，改用 crate 级全局单例（parking_lot Mutex），
# 由 Flutter 侧调用 init_orbit_state() 初始化。
# =============================================================================
[package]
name = "orbit-flutter"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
name = "orbit_flutter"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
# 核心库（Monorepo path 依赖；内部依赖统一注册在根 workspace.dependencies）
orbit-core.workspace = true

# flutter_rust_bridge v2（默认特性含 tokio runtime 与 spawn；chrono 支持时间类型）
flutter_rust_bridge = { version = "=2.12.0", features = ["chrono"] }

# 全局状态单例
parking_lot = "0.12"
once_cell.workspace = true

# 异步与序列化
tokio.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true

# biometric 密钥链三件套 Base64 编码（core::crypto::biometric 同口径）
base64.workspace = true

# 数据库（守护任务直查 SQL 用）
sqlx.workspace = true

# 日志：log 门面 + 平台 logger 安装点（F81，2026-10-01 第六轮）
# init_app（#[frb(init)]，库加载时执行）调用 logging::install() 把 android_logger
# 挂上 log 门面——orbit-core 与本 crate 的 `log::*` 由此落到 logcat。
# 桌面端不走本 crate（tauri_plugin_log 安装），日志口径同为 Info。
log.workspace = true

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.15"

# FRB 宏内部使用 cfg(frb_expand) 标注展开产物，注册免 unexpected_cfgs 告警
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
