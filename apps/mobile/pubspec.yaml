name: orbit
description: "Orbit（循迹）移动端 — Flutter 重构版。桌面端为 Tauri（apps/desktop），两端共享 crates/orbit-core。"
publish_to: "none"
version: 0.1.1+5
environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # ── UI 组件体系（shadcn_flutter）──
  # 接入方式：MaterialApp.router + builder 内包 ShadcnLayer（方案 B）。
  # 为什么不用 MaterialShadcnApp（方案 A）：其依赖 shadcn_flutter_material 全库
  # 仅 0.0.54 一个版本，硬要求 Dart >=3.13 + Flutter >=3.47；本仓库锁
  # Flutter 3.44.2 / Dart 3.12.2 无法解析。方案 B 无需 material_ui 迁移，
  # Material 主题（core/theme/app_theme.dart）与 shadcn 主题并存，页面层不受影响。
  # 0.0.x 属预 1.0，API 漂移风险高：此处**精确锁版、不带 ^**，升版须单独立项评估。
  shadcn_flutter: 0.0.53

  # 水平滑动操作（shadcn 无侧滑原语；侧滑完成/删除是移动端核心手感，保留）
  flutter_slidable: ^4.0.3

  # 月历（农历/节气/休班/事件圆点经 CalendarBuilders 注入；
  # 依赖 intl ^0.20.0 与现有一致，需在 main() 先 initializeDateFormatting）
  table_calendar: 3.2.1



  # 状态管理（wait-home/mobile 同款：Riverpod 3.x 手动声明，无 codegen）
  flutter_riverpod: ^3.3.0

  # 路由（栈式导航语义：/todo → /todo/tasks → /todo/:id）
  go_router: ^17.3.0

  # 时间格式化（相对时间、zh-CN 本地化）
  intl: ^0.20.0

  # 应用数据目录（FRB base_dir 参数源）
  path_provider: ^2.1.0

  # 文件选择（CSV 导入迁移路径：选 Todoist/TickTick 导出的 CSV 文件）
  file_picker: ^10.3.2

  # 附件拍照来源（详情页附件区相机入口；相册仍走 file_picker）
  image_picker: ^1.0.7

  # 关于页真实构建版本号（读取原生包版本，不硬编码）
  package_info_plus: ^8.1.0

  # 本地通知三件套（Phase 7 平台集成：提醒到期系统通知，无权限静默降级 toast）
  flutter_local_notifications: ^22.3.0
  timezone: ^0.11.1
  flutter_timezone: ^5.1.0

  # 生物识别解锁三件套：指纹闸门（local_auth，要求宿主 Activity 为
  # FragmentActivity）+ 密钥链存储（flutter_secure_storage，Android
  # Keystore 加密；存 encrypted_db_key_bio/biometric_key/nonce 三键）
  local_auth: ^3.0.0
  flutter_secure_storage: ^10.0.0-beta.4

  # ── FRB 桥接（cargokit FFI 插件壳，构建 crates/orbit-flutter）──
  flutter_rust_bridge: 2.12.0
  rust_lib_orbit:
    path: rust_builder

  # Android 桌面小组件（#3 存在感链条）：widget 数据快照写入 + 添加引导；
  # 勾选/磁贴交互走原生广播直写 SQLite（无 isolate 依赖，见 TodoWidgetProvider）
  home_widget: ^0.9.3

  # Markdown 描述链接点击跳系统浏览器（官方第一方插件，平台桥接非 UI 库，
  # 与 file_picker/local_auth 同类）
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  # 真机/模拟器 E2E（P2 提醒升级验收：后台闹钟链路）
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  # 品牌图（启动等待画面白底居中）：与桌面端**同一枚图标**，
  # 由 scripts/generate_icons.py 产出（同 icon-transparent 母版口径）
  assets:
    - assets/app_icon.png
