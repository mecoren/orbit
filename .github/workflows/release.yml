# Orbit 发布流水线 —— 触发条件 / 步骤 / 角色见 docs/08_发布与更新流程.md
#
# 触发：
#   1. push tag `v*`   —— 正式发布。tag 名必须等于清单版本号（audit job 强制校验），
#                        推送即发布（Release 立即公开，撤销见 08 文档 §7）。
#   2. workflow_dispatch —— 预演：dry_run 默认 true，只构建上传 artifact、不建 Release。
#                        发版前先跑一遍 dry_run 确认三平台可构建是标准动作。
#
# 产物：桌面三平台安装包 + Android APK + latest.json（应用内更新清单）
#       + SHA256SUMS（未签名平台的主要完整性依据）
#
# 签名状态（ADR 0004 §2）：证书物料未注入时全部走未签名路径：
# - Windows：无代码签名证书 → NSIS/MSI 未签名（SmartScreen 提示由 Release 说明缓解）
# - macOS：signingIdentity=null → 未签名 DMG（Gatekeeper xattr 放行说明）
# - Linux：deb/AppImage 无签名惯例，SHA256SUMS 校验
# - Android：android/key.properties 缺失时回落 debug 签名（本文件不涉及）
# 但 **updater 产物签名密钥必填**：bundle.createUpdaterArtifacts=true 时缺
# TAURI_SIGNING_PRIVATE_KEY 会直接构建失败（刻意的安全保护，audit job 提前拦截）。
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "只构建不发布（默认开启；确认流水线无问题后手动关闭才真正发版）"
        required: false
        default: true
        type: boolean

# 发布不可并发取消：被腰斩的 Release 比排队更糟（半套资产+缺 latest.json），
# 故 cancel-in-progress 恒 false（与 ci.yml 的取消策略刻意相反）。
concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# 最小权限：默认只读，只有需要写 Release 的作业在 job 级提权。
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # ────────────────────────────────────────────────────────────────────────
  # 发版前置门禁：版本一致性 / tag 对齐 / 签名密钥就位 / 依赖安全审计。
  # 全部在廉价 job 里失败，避免矩阵构建 20 分钟后才发现版本号手滑。
  # ────────────────────────────────────────────────────────────────────────
  audit:
    name: 发版前置门禁
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 版本一致性（五处清单 + 两个 Cargo.lock）
        run: node scripts/bump-version.mjs --check

      - name: tag 与版本号一致
        if: github.event_name == 'push'
        run: |
          VER=$(node -p "require('./apps/desktop/package.json').version")
          if [ "v${VER}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} 与清单版本 v${VER} 不一致——先跑 pnpm bump ${GITHUB_REF_NAME#v} 再打 tag"
            exit 1
          fi
          echo "tag 与版本号一致：${GITHUB_REF_NAME}"

      - name: updater 签名私钥就位
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          # bundle.createUpdaterArtifacts=true 下缺私钥构建必失败；提前给出可执行的修复指引。
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY}" ]; then
            echo "::error::缺少 Secrets.TAURI_SIGNING_PRIVATE_KEY——应用内更新产物无法签名。"
            echo "生成：pnpm --filter orbit tauri signer generate -w ~/.tauri/orbit.key"
            echo "配置：Settings → Secrets → TAURI_SIGNING_PRIVATE_KEY（私钥内容）"
            echo "      + TAURI_SIGNING_PRIVATE_KEY_PASSWORD（口令），公钥写入 tauri.conf.json 的 plugins.updater.pubkey。"
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable

      # 观察期门禁：先把基线打出来，确认真实漏洞口径后再把 continue-on-error 去掉转硬拦截
      # （promote 时机与口径见 docs/08_发布与更新流程.md §6）。
      - name: cargo audit（观察期，不拦截）
        continue-on-error: true
        run: |
          set -euo pipefail
          cargo install cargo-audit --locked || true
          for lock in Cargo.lock apps/desktop/src-tauri/Cargo.lock; do
            echo "--- audit ${lock} ---"
            cargo audit --file "$(pwd)/${lock}" || true
          done

      - name: pnpm audit（观察期，不拦截）
        continue-on-error: true
        run: pnpm audit --prod --audit-level moderate

  # ────────────────────────────────────────────────────────────────────────
  # 桌面三平台构建：tauri-action 构建 + 创建 Release + 上传本平台安装包与 .sig。
  #
  # includeUpdaterJson 恒 false：latest.json 全平台共享一份，矩阵作业并行时
  # 各自「下载 → 合并 → PATCH 回写」构成读-改-写竞态（PATCH 会命中被并发删除的
  # asset id 而 404）。改由 publish-updater-manifest 在全部构建结束后单点生成。
  # ────────────────────────────────────────────────────────────────────────
  desktop:
    name: desktop (${{ matrix.settings.label }})
    needs: [audit]
    runs-on: ${{ matrix.settings.os }}
    permissions:
      contents: write # 创建 Release 并上传资产
    strategy:
      fail-fast: false
      matrix:
        settings:
          - label: windows-x86_64
            os: windows-latest
            args: ""
          - label: macos-aarch64
            os: macos-latest
            args: "--target aarch64-apple-darwin"
          - label: linux-x86_64
            os: ubuntu-22.04
            args: ""
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: Rust 工具链（macOS aarch64 target）
        if: matrix.settings.label == 'macos-aarch64'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> apps/desktop/src-tauri/target
          cache-on-failure: true

      - name: Linux 系统依赖（webkit2gtk 4.1）
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: 构建桌面安装包
        uses: tauri-apps/tauri-action@v1
        env:
          # 证书物料注入点（ADR 0004 §2）——Secrets 未配置时 tauri-action
          # 自动走未签名路径，无需修改本文件：
          # Windows 代码签名：TAURI_SIGNING_PRIVATE_KEY + TAURI_SIGNING_PRIVATE_KEY_PASSWORD
          # macOS 签名+公证：APPLE_CERTIFICATE / APPLE_CERTIFICATE_PASSWORD /
          #                  APPLE_SIGNING_IDENTITY / APPLE_ID / APPLE_PASSWORD / APPLE_TEAM_ID
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # updater 产物签名（bundle.createUpdaterArtifacts）：产出 .sig，
          # publish-updater-manifest 消费其内容合成 latest.json。
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          # tag 推送且非 dry_run 才发版；dry_run 时留空 → 只构建、只传 artifact
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && inputs.dry_run != true && github.ref_name || '' }}
          releaseName: "Orbit ${{ github.ref_name }}"
          # 直发（非草稿）：应用内 updater 的 endpoint 是
          # /releases/latest/download/latest.json，草稿态 Release 对该地址 404。
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: false
          releaseBody: |
            参见 [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md)。

            ## 完整性校验（未签名平台的信任依据）

            下载 `SHA256SUMS` 后：`sha256sum -c SHA256SUMS`（Windows: `Get-FileHash`）。

            ## 未签名提示

            - **Windows**：SmartScreen 可能提示「未知发布者」——更多信息 → 仍要运行。
            - **macOS**：Gatekeeper 提示无法验证开发者——右键打开，或
              `xattr -cr /Applications/Orbit.app` 后再启动。
            - **Android**：`app-release.apk` 直接覆盖安装（同包名
              `cn.wait.orbit`）；启用「未知来源」安装即可。

            ## 应用内更新

            设置 → 关于与更新 → 检查更新（读取本 Release 的 `latest.json`）。
          args: ${{ matrix.settings.args }}

  # ────────────────────────────────────────────────────────────────────────
  # Android APK：只构建 + 传 artifact，上传 Release 交给 publish-extras 统一做
  # （避免与此处的 Release 创建竞态：Android 通常先于桌面矩阵完成，
  #  softprops/action-gh-release 抢先按 tag 建 Release 后会把 tauri-action
  #  已发布的 Release 挤成 draft，造成公开下载 404）。
  # ────────────────────────────────────────────────────────────────────────
  android:
    name: android apk
    needs: [audit]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # cargokit 构建 crates/orbit-flutter 需要本仓库工具链版本
      - uses: dtolnay/rust-toolchain@stable

      - name: 构建 release APK
        # release 签名：自托管 runner 挂载 android/key.properties 后自动生效；
        # 公共 runner 无该文件 → debug 签名（可安装，不可上架）
        run: flutter build apk --release

      - name: 上传 APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: orbit-apk
          path: apps/mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7

  # ────────────────────────────────────────────────────────────────────────
  # 应用内更新清单 latest.json：单点生成，读各平台已上传的 .sig 内容合成。
  # 资产名不做任何改名（与 tauri-action 默认产物名逐字节一致），改名会让
  # manifest 的 URL 与 Release 资产错位 → 更新检查 404。
  # 平台键写法依据 tauri-plugin-updater 的查找顺序：
  # 先 `{os}-{arch}-{installer}`（nsis/msi/app/appimage/deb），命中不到回落 `{os}-{arch}`，
  # 故同一产物写两份键（带后缀 + 基础键）才能覆盖不同安装方式的存量客户端。
  # ────────────────────────────────────────────────────────────────────────
  publish-updater-manifest:
    name: 生成更新清单 latest.json
    needs: [desktop]
    if: startsWith(github.ref, 'refs/tags/v') && inputs.dry_run != true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: 合成并上传 latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          # 版本号取自 tauri.conf.json（产物与清单同源；tag 名已在 audit job 校验一致）
          VER=$(jq -r .version apps/desktop/src-tauri/tauri.conf.json)
          BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"
          API="repos/{owner}/{repo}"

          # 全程 Release ID 路由：tag 型端点对 draft 一律 404，人工把 Release
          # 改成草稿后本作业仍应可重跑（幂等）。
          read -r RELEASE_ID IS_DRAFT < <(
            gh release view "$TAG" --json databaseId,isDraft --jq '[.databaseId, .isDraft] | @tsv'
          )
          if [ -z "${RELEASE_ID}" ]; then
            echo "::error::未找到 tag ${TAG} 对应的 Release——desktop 作业未成功创建，先修上游再重跑本作业"
            exit 1
          fi
          echo "release id: ${RELEASE_ID}（draft=${IS_DRAFT}）"

          ENTRIES="windows-x86_64|Orbit_${VER}_x64-setup.exe
          windows-x86_64-nsis|Orbit_${VER}_x64-setup.exe
          darwin-aarch64|Orbit_aarch64.app.tar.gz
          darwin-aarch64-app|Orbit_aarch64.app.tar.gz
          linux-x86_64|Orbit_${VER}_amd64.AppImage.tar.gz
          linux-x86_64-appimage|Orbit_${VER}_amd64.AppImage.tar.gz
          linux-x86_64-deb|Orbit_${VER}_amd64.deb"

          declare -A ASSET_ID
          while IFS=$'\t' read -r aid aname; do ASSET_ID["$aname"]="$aid"; done < <(
            gh api "${API}/releases/${RELEASE_ID}/assets" --paginate | jq -r '.[] | "\(.id)\t\(.name)"'
          )

          PLATFORMS='{}'
          while IFS= read -r entry; do
            entry="$(echo "$entry" | tr -d '[:space:]')"
            [ -n "$entry" ] || continue
            key="${entry%%|*}"
            asset="${entry#*|}"
            sig_id="${ASSET_ID["${asset}.sig"]:-}"
            if [ -z "$sig_id" ]; then
              echo "::warning::缺少签名资产 ${asset}.sig，跳过平台键 ${key}"
              continue
            fi
            sig=$(gh api "${API}/releases/assets/${sig_id}" -H "Accept: application/octet-stream" | tr -d '[:space:]')
            PLATFORMS=$(jq -n --argjson p "$PLATFORMS" --arg k "$key" --arg s "$sig" --arg u "${BASE}/${asset}" \
              '$p + {($k): {signature: $s, url: $u}}')
            echo "平台键 ${key} → ${asset}"
          done <<< "$ENTRIES"

          COUNT=$(jq 'length' <<< "$PLATFORMS")
          if [ "$COUNT" -eq 0 ]; then
            echo "::error::未解析出任何平台条目，拒绝发布空清单（多为签名密钥不匹配或产物缺失）"
            exit 1
          fi

          jq -n --arg v "$VER" --argjson p "$PLATFORMS" \
            '{ version: $v,
               notes: "更多细节见 CHANGELOG.md（仓库根目录）。",
               pub_date: (now | strftime("%Y-%m-%dT%H:%M:%S.000Z")),
               platforms: $p }' > latest.json

          echo "---- latest.json（${COUNT} 个平台键）----"
          jq -r '.platforms | to_entries[] | "\(.key): \(.value.url)"' latest.json

          # 崩溃安全三步（临时名 → 删旧 → 改名）：任一步失败新旧清单至少存活一个，重跑可恢复
          TMP_NAME="latest.json.new"
          TMP_ID="${ASSET_ID["$TMP_NAME"]:-}"
          if [ -n "$TMP_ID" ]; then
            gh api -X DELETE "${API}/releases/assets/${TMP_ID}" >/dev/null
          fi
          curl -fsS -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Content-Type: application/octet-stream" \
            --data-binary @latest.json \
            "https://uploads.github.com/repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets?name=${TMP_NAME}" >/dev/null
          CUR_ID="${ASSET_ID["latest.json"]:-}"
          if [ -n "$CUR_ID" ]; then
            gh api -X DELETE "${API}/releases/assets/${CUR_ID}" >/dev/null
          fi
          NEW_ID=$(gh api "${API}/releases/${RELEASE_ID}/assets" --paginate |
            jq -r --arg n "$TMP_NAME" '[.[] | select(.name == $n)][0].id')
          gh api -X PATCH "${API}/releases/assets/${NEW_ID}" -f name="latest.json" >/dev/null
          echo "已上传 latest.json"

          # 兜底确保发布态（幂等）：草稿 Release 会让 /releases/latest/download 与
          # 应用内更新整条链路 404。失败不阻断（资产已就绪），但告警提示人工检查。
          if [ "$IS_DRAFT" = "true" ]; then
            if gh api -X PATCH "${API}/releases/${RELEASE_ID}" -f draft=false >/dev/null; then
              echo "已将 Release 由草稿转为公开"
            else
              echo "::warning::Release 仍为草稿态，应用内更新会 404——请人工确认可见性"
            fi
          fi

  # ────────────────────────────────────────────────────────────────────────
  # 附加资产：Android APK + SHA256SUMS（覆盖含 APK 在内全部平台产物）。
  # SHA256SUMS 在最后一步生成，故 sums 里包含 latest.json 与实际发布的 APK。
  # 统一用 gh release upload（不用 action-gh-release：该 Action 在 tag 被强移后
  # 会走 create/update 兜底，把已发布的 Release 挤回 draft）。
  # ────────────────────────────────────────────────────────────────────────
  publish-extras:
    name: 上传 APK 与 SHA256SUMS
    needs: [android, publish-updater-manifest]
    if: startsWith(github.ref, 'refs/tags/v') && inputs.dry_run != true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 下载 APK artifact
        uses: actions/download-artifact@v4
        with:
          name: orbit-apk
          path: extras

      - name: 上传 APK 并汇总 SHA256SUMS
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 本作业不 checkout（只需 artifact + Release 读写），gh 无法从 git remote 推断仓库
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"

          gh release upload "$TAG" extras/app-release.apk --clobber

          mkdir -p dist
          gh release download "$TAG" --dir dist --clobber
          # 上一轮的 SHA256SUMS 不参与自校验
          rm -f dist/SHA256SUMS

          if [ "$(find dist -type f | wc -l)" -eq 0 ]; then
            echo "::error::Release 上没有可校验的产物——上游作业未上传成功"
            exit 1
          fi
          ( cd dist && sha256sum ./* > ../SHA256SUMS )
          echo "---- SHA256SUMS ----"
          cat SHA256SUMS

          gh release upload "$TAG" SHA256SUMS --clobber
