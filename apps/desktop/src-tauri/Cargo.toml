# =============================================================================
# src-tauri — Tauri 2 桌面端 Rust 壳（唯一前端通道）
# 职责：薄壳包装 orbit-core 的公共 API 为 #[tauri::command]，不含业务逻辑。
#
# 参考 omnipass 模式：本 crate 为嵌套【独立 workspace】（下方空 [workspace] 表），
# 刻意脱离根 workspace，避免 Tauri 依赖图与核心库耦合；
# 依赖版本在本文件单点声明，与根 Cargo.toml 不共享。
# =============================================================================
[workspace]

[package]
name = "orbit-desktop"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[lib]
name = "orbit_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
# 核心库（Monorepo path 依赖）
orbit-core = { path = "../../../crates/orbit-core" }

# Tauri v2 + 插件（02 文档 §七：notification/window-state/dialog/fs/shell/log）
# devtools 特性不启用：wry 在 debug 构建恒开 devtools（cfg(debug_assertions)），
# 仅 release 需要；发版口径不给用户开 F12（避免暴露 SQLCipher 数据流）。
tauri = { version = "2", features = ["image-png", "tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-notification = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-log = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

# 序列化
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# AppState 持有 SqlitePool
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "sqlite",
    "macros",
    "migrate",
    "chrono",
    "json",
] }

# 提醒轮询守护（专用 SQL + 去重集合 + 定时器 + 时间格式化）
once_cell = "1"
tokio = { version = "1.45", features = ["rt-multi-thread", "macros", "sync", "fs", "io-util"] }
chrono = { version = "0.4", features = ["serde"] }

# 系统通知直发（P2 提醒升级：tauri 插件 desktop 路径不透传 actions，
# notify-rust 三平台支持通知按钮 + wait_for_action 回调；版本随插件传递依赖锁定 4.18）
notify-rust = "4.18"

# M3 安全与同步（base64 编解码 + 主机名；keyring 见下方桌面段）
base64 = "0.22"
whoami = "1.5"

# 桌面专属依赖：window-state 插件（窗口概念）、keyring 3.x（移动端无原生
# 凭据库）、dirs（数据目录早期解析仅桌面需要，移动端统一走 Tauri app_data_dir）
# 注：Cargo 的 target 依赖解析不认 tauri-build 注入的 cfg(desktop)（实测
# cargo tree 桌面/安卓双目标均不匹配），须用 rustc 原生 target cfg 表达。
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-window-state = "2"
keyring = { version = "3", features = ["windows-native", "apple-native", "linux-native"] }
dirs = "6"

# Windows 平台：Mica 云母材质（DWM 直调）+ 系统字体枚举预留
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Graphics_Dwm",
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_SystemInformation",
    # Scheduled Toast（托盘退出后的离线提醒）：XML 组装 + 系统调度器
    "Data_Xml_Dom",
    "UI_Notifications",
] }
# AUMID 通知身份注册（Toast 横幅 DisplayName/IconUri 落 HKCU 注册表）
windows-registry = "0.6"
# 通知图标 PNG 编码（default_window_icon RGBA → IconUri 文件；传递依赖树已存在，此处显式声明直接使用）
image = { version = "0.25", default-features = false, features = ["png"] }
# 获取窗口 HWND 设置 Mica（版本与 Tauri 内部 raw-window-handle 对齐）
raw-window-handle = "0.6"
# WebView2 内存档位（驻留降 Low）：ICoreWebView2_19 直调，版本随 wry 传递依赖锁定
webview2-com-sys = "0.38"
# COM 接口 cast trait（Interface）；版本与 windows 0.61 同族对齐
windows-core = "0.61"

# 日志级别配置（tauri-plugin-log Builder 使用 log::LevelFilter）
log = "0.4"

[lints.rust]
# desktop cfg 由 tauri-build 注入；显式登记避免依赖其自动 emit 行为
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(mobile)', 'cfg(desktop)'] }

# 与根 Cargo.toml [profile.release] 同口径——本 crate 是嵌套独立 workspace，
# 根 workspace 的 profile 对它不生效（2026-09-14 前桌面 release 一直在用
# Cargo 默认配置：16 codegen units、无 LTO、带符号表，体积/内存双输）。
# panic=abort 与 Tauri 兼容（壳层无 catch_unwind 依赖）。
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
