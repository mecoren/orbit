# P0 最小门禁:typecheck + 单测 + web 构建(Rust 五端矩阵按 06 文档另立)
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 版本由根 package.json 的 packageManager 字段驱动（与本地 pnpm 统一）
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 类型检查
        run: pnpm --filter orbit typecheck

      - name: 单元测试
        run: pnpm --filter orbit test

      - name: 生产构建(纯 web,不含 Tauri)
        run: pnpm --filter orbit build

      # Playwright 冒烟（07 报告 §五-P2#19 尾巴）：纯浏览器 mock IPC 环境，
      # 免 Rust 工具链/免 Tauri 壳，与上面 web job 同一依赖面。
      # playwright.config 的 webServer 会自行起 5273 隔离 dev server。
      - name: 安装 Playwright 浏览器
        run: npx playwright install --with-deps chromium

      - name: Playwright 冒烟测试
        run: pnpm e2e

  # 内存门禁（docs/09 内存与性能治理专项）：两件事都零业务副作用、纯只读。
  # audit-unbounded 扫常驻累加容器缺 `bounded` 标记；growth-curve 用同一份 dist
  # 在 Chromium 里跑 1k/5k/10k 三档 × 3 次中位，判堆驻留/增长斜率/操作峰值/GC 后回落。
  # Tauri exe 的真机口径（390MB 空闲 / 758MB 峰）依赖 Windows + WebView2，
  # 不进 CI，留本地 `node perf-metrics/memory3.mjs --gate`（发版第 4 步）。
  perf-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 生产构建(门禁量的是构建产物口径)
        run: pnpm --filter orbit build

      - name: 安装 Playwright 浏览器
        run: npx playwright install --with-deps chromium

      - name: 常驻无界结构审计
        run: node perf-metrics/audit-unbounded.mjs --gate

      - name: 内存增长曲线与泄漏门禁
        run: node perf-metrics/growth-curve.mjs --gate

  rust-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 工具链版本由根目录 rust-toolchain.toml 锁定，runner 自带 rustup 自动按其安装
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates

      - name: 检查核心库 workspace
        run: cargo check --workspace --all-targets

      # --lib 只跑各 crate 的库内单测：tests/ 下的 m4 WebDAV 集成用例要真实远端，
      # runner 没有该环境（本机同口径——AGENTS.md 把它列为已知非回归失败）
      - name: 核心库单元测试
        run: cargo test --workspace --lib

  flutter-mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          # 锁定具体版本：stable 滚动会改变 dart format 的 import 分组规则，
          # 导致 FRB codegen 的 dart 产物与本地（3.44.2）不一致而误报门禁
          # （CI 曾因 runner 拿到 3.47.2 在 codegen 一致性步骤持续失败）
          flutter-version: 3.44.2
          channel: stable
          cache: true

      # FRB codegen 一致性门禁：重新生成后产物必须与仓库一致
      # （工具链同样由根目录 rust-toolchain.toml 锁定）
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            crates
            ~/.cargo

      - name: 安装 flutter_rust_bridge_codegen（锁定 2.12.0）
        run: cargo install flutter_rust_bridge_codegen --version 2.12.0

      - name: FRB codegen 一致性校验
        working-directory: ${{ github.workspace }}
        run: |
          flutter_rust_bridge_codegen generate \
            --config-file crates/orbit-flutter/flutter_rust_bridge.yaml
          # 生成物入库前统一经 rustfmt（与仓库内已格式化的 frb_generated.rs 对齐）
          cargo fmt --all
          git diff --exit-code apps/mobile/lib/src/rust crates/orbit-flutter/src/frb_generated.rs \
            || (echo "::error::FRB 生成物与仓库不一致，请本地重新执行 codegen 并运行 cargo fmt 后提交" && exit 1)

      - name: 静态分析
        run: flutter analyze

      - name: 单元测试
        run: flutter test
