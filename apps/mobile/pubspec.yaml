name: orbit
description: "Orbit（循迹）移动端 — Flutter 重构版。桌面端为 Tauri（apps/desktop），两端共享 crates/orbit_core。"
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # 状态管理（wait-home/mobile 同款：Riverpod 3.x 手动声明，无 codegen）
  flutter_riverpod: ^3.3.0

  # 路由（栈式导航语义：/todo → /todo/tasks → /todo/:id）
  go_router: ^17.3.0

  # 时间格式化（相对时间、zh-CN 本地化）
  intl: ^0.20.0

  # ── FRB 桥接（Phase 5 接入；接入前 UI 层经 MockOrbitBridge 开发）──
  # flutter_rust_bridge: <锁定版本>
  # rust_lib_orbit:
  #   path: rust_builder

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
