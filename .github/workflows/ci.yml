# P0 最小门禁:typecheck + 单测 + web 构建(Rust 五端矩阵按 06 文档另立)
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 版本由根 package.json 的 packageManager 字段驱动（与本地 pnpm 统一）
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 类型检查
        run: pnpm --filter orbit typecheck

      - name: 单元测试
        run: pnpm --filter orbit test

      - name: 生产构建(纯 web,不含 Tauri)
        run: pnpm --filter orbit build

  rust-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates

      - name: 检查核心库 workspace
        run: cargo check --workspace --all-targets

  flutter-mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # FRB codegen 一致性门禁：重新生成后产物必须与仓库一致
      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            crates
            ~/.cargo

      - name: 安装 flutter_rust_bridge_codegen（锁定 2.12.0）
        run: cargo install flutter_rust_bridge_codegen --version 2.12.0

      - name: FRB codegen 一致性校验
        working-directory: ${{ github.workspace }}
        run: |
          flutter_rust_bridge_codegen generate \
            --config-file crates/flutter-plugin-orbit/flutter_rust_bridge.yaml
          git diff --exit-code apps/mobile/lib/src/rust crates/flutter-plugin-orbit/src/frb_generated.rs \
            || (echo "::error::FRB 生成物与仓库不一致，请本地重新执行 codegen 并提交" && exit 1)

      - name: 静态分析
        run: flutter analyze

      - name: 单元测试
        run: flutter test
