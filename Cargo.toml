# =============================================================================
# Orbit（循迹）— Monorepo 根 Cargo Workspace
# 参考 wait-home 模式：[workspace.dependencies] 单点管控所有 crate 依赖版本，
# 子 crate 一律 `xxx.workspace = true` 引用，避免版本漂移。
# =============================================================================
[workspace]
resolver = "2"
members = [
    "orbit_core",
    "src-tauri",
]

[workspace.package]
edition = "2024"
rust-version = "1.96"
version = "0.1.0"

[workspace.dependencies]
# 异步运行时
tokio = { version = "1.45", features = ["rt-multi-thread", "macros", "sync", "fs", "io-util"] }
async-trait = "0.1"
futures = "0.3"

# 序列化
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 数据库
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate", "chrono", "json"] }
libsqlite3-sys = { version = "0.30", features = ["bundled"] }

# 加密
aes-gcm = "0.10"
pbkdf2 = { version = "0.12", features = ["simple"] }
hmac = "0.12"
sha2 = "0.10"
subtle = "2"
rand = "0.8"

# 同步与网络
reqwest = { version = "0.12", default-features = false, features = ["cookies", "gzip", "json", "rustls-tls"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
base64 = "0.22"
quick-xml = { version = "0.36", features = ["serialize"] }
zstd = "0.13"

# 工具
thiserror = "2"
anyhow = "1"
once_cell = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
whoami = "1.5"
tempfile = "3"
tokio-util = { version = "0.7", features = ["rt"] }
# URL 处理与正则（s3/webdav 适配器基础依赖；02 文档 §七未列，平移时实测补齐）
regex = "1"
url = "2"
urlencoding = "2"

# 日志（sqlx/hyper 传递引入 log v0.4，显式声明供 orbit_core / 插件配置使用）
log = "0.4"

# 系统钥匙串（M3：CEK 保管 + 同步密码缓存 service=orbit.sync-crypto）
# 注：keyring 3.x 阻塞 API 为默认；三平台原生凭据库特性显式声明
keyring = { version = "3", features = ["windows-native", "apple-native", "linux-native"] }

# Tauri 2（全五端单前端）
tauri = { version = "2", features = ["devtools", "image-png"] }
tauri-plugin-shell = "2"
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-window-state = "2"
tauri-plugin-log = "2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
