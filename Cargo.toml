# =============================================================================
# Orbit（循迹）— Monorepo 根 Cargo Workspace
# 参考 omnipass 模式：
#   - 根 workspace 仅管理 crates/*（核心库 + 各端桥接层），单点管控依赖版本，
#     子 crate 一律 `xxx.workspace = true` 引用，避免版本漂移。
#   - apps/desktop/src-tauri 为嵌套独立 workspace，自行声明版本；
#   - apps/mobile 为 Flutter 应用，不在任何 Cargo workspace 内，
#     经 crates/orbit-flutter（FRB 桥接）复用 orbit-core。
# =============================================================================
[workspace]
resolver = "2"
members = [
    "crates/orbit-core",
    "crates/orbit-flutter",
]

[workspace.package]
edition = "2024"
rust-version = "1.96"
version = "0.1.0"

# 内部 crate 统一注册（omnipass 模式）：成员用 `xxx.workspace = true` 引用
# 命名约定：包名/目录 kebab-case；依赖键随包名（orbit-core），代码 import 用 lib 名 orbit_core
[workspace.dependencies]
orbit-core = { path = "crates/orbit-core" }
# 异步运行时
tokio = { version = "1.45", features = ["rt-multi-thread", "macros", "sync", "fs", "io-util"] }
async-trait = "0.1"
futures = "0.3"

# 序列化
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 数据库
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate", "chrono", "json"] }
libsqlite3-sys = { version = "0.30", features = ["bundled"] }

# 加密
aes-gcm = "0.10"
pbkdf2 = { version = "0.12", features = ["simple"] }
hmac = "0.12"
sha2 = "0.10"
subtle = "2"
rand = "0.8"

# 同步与网络
reqwest = { version = "0.12", default-features = false, features = ["cookies", "gzip", "json", "rustls-tls"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
base64 = "0.22"
quick-xml = { version = "0.36", features = ["serialize"] }
zstd = "0.13"

# 工具
thiserror = "2"
anyhow = "1"
once_cell = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
whoami = "1.5"
tempfile = "3"
tokio-util = { version = "0.7", features = ["rt"] }
# URL 处理（s3/webdav 适配器基础依赖；02 文档 §七未列，平移时实测补齐）
url = "2"
urlencoding = "2"

# 日志（sqlx/hyper 传递引入 log v0.4，显式声明供 orbit-core / 插件配置使用）
log = "0.4"

# 注：Tauri 系依赖与 keyring 已随桌面壳独立 workspace 化移出本清单，
# 版本由 apps/desktop/src-tauri/Cargo.toml 单点声明。

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
