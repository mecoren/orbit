# P0 最小门禁:typecheck + 单测 + web 构建(Rust 五端矩阵按 06 文档另立)
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 版本由根 package.json 的 packageManager 字段驱动（与本地 pnpm 统一）
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 类型检查
        run: pnpm --filter orbit typecheck

      - name: 单元测试
        run: pnpm --filter orbit test

      - name: 生产构建(纯 web,不含 Tauri)
        run: pnpm --filter orbit build

      # Playwright 冒烟（07 报告 §五-P2#19 尾巴）：纯浏览器 mock IPC 环境，
      # 免 Rust 工具链/免 Tauri 壳，与上面 web job 同一依赖面。
      # playwright.config 的 webServer 会自行起 5273 隔离 dev server。
      - name: 安装 Playwright 浏览器
        run: npx playwright install --with-deps chromium

      - name: Playwright 冒烟测试
        run: pnpm e2e

  # 内存门禁（口径决策见 docs/adr/0007，归因与进度见 docs/09 内存与性能治理专项）：
  # 两件事都零业务副作用、纯只读。audit-unbounded 扫常驻累加容器缺 `bounded` 标记；
  # growth-curve 用同一份 dist 在 Chromium 里跑 1k/5k/10k 三档 × 3 次中位，判堆驻留/
  # 增长斜率/操作峰值/GC 后回落。采样前后强制 window.gc()，故本 job 的数字与
  # 09-12 报告的未 GC 口径不可互相换算。真机 Tauri exe 的进程树口径依赖 Windows +
  # WebView2，不进 CI，留本地 `node perf-metrics/memory3.mjs --gate`
  # （已列入 docs/08 正式发布门禁第 1 条）。
  perf-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 生产构建(门禁量的是构建产物口径)
        run: pnpm --filter orbit build

      - name: 安装 Playwright 浏览器
        run: npx playwright install --with-deps chromium

      - name: 常驻无界结构审计
        run: node perf-metrics/audit-unbounded.mjs --gate

      - name: 内存增长曲线与泄漏门禁
        run: node perf-metrics/growth-curve.mjs --gate

      # M5 代码侧门禁：禁止新增「整文件 List<int> 跨桥」的公开桥接口。
      # 这类回归不会让任何测试变红，只会让内存悄悄翻倍，故用静态清单拦停。
      - name: 移动端桥接口整包过桥审计
        run: node perf-metrics/mobile-bridge-audit.mjs

      # 双端桥一致性：桌面 Tauri 命令 vs 移动 FRB 函数。
      # 「某能力只接了一端」不会让任何测试变红（桌面有、移动端摸不到），
      # 只能靠人工普查发现——docs/07 #114/#117 就是这么找出来的。白名单
      # 里每条都写明「为什么单端合理」，新增单端命令即拦停。
      - name: 双端桥一致性审计
        run: node perf-metrics/bridge-parity.mjs

  rust-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 工具链版本由根目录 rust-toolchain.toml 锁定，runner 自带 rustup 自动按其安装
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates

      - name: 检查核心库 workspace
        run: cargo check --workspace --all-targets

      - name: clippy（核心库 workspace，-D warnings）
        run: cargo clippy --workspace --all-targets -- -D warnings

      # --tests 覆盖各 crate 库内单测 + crates/orbit-core/tests/ 全部集成用例。
      # 此前只跑 --lib，12 个集成测试文件从不进 CI——拼音索引台账守卫
      # (search_index_guard) 就是这样静默翻红的。m4_sync_e2e / holiday_net_e2e
      # 带 #[ignore] 需真实远端，自动跳过；其余用例走 tests/common 零依赖假服务。
      # sync_fault_matrix（F22 条件头 / F23 分片协议的唯一网络级证据，含 9MiB
      # 分片用例约 4.5 分钟）已包含在本步骤内，不再单独点名重复执行。
      - name: 核心库单测与集成测试
        run: cargo test --workspace --tests

  flutter-mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          # 锁定具体版本：stable 滚动会改变 dart format 的 import 分组规则，
          # 导致 FRB codegen 的 dart 产物与本地（3.44.2）不一致而误报门禁
          # （CI 曾因 runner 拿到 3.47.2 在 codegen 一致性步骤持续失败）
          flutter-version: 3.44.2
          channel: stable
          cache: true

      # FRB codegen 一致性门禁：重新生成后产物必须与仓库一致
      # （工具链同样由根目录 rust-toolchain.toml 锁定）
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            crates
            ~/.cargo

      - name: 安装 flutter_rust_bridge_codegen（锁定 2.12.0）
        run: cargo install flutter_rust_bridge_codegen --version 2.12.0

      - name: FRB codegen 一致性校验
        working-directory: ${{ github.workspace }}
        run: |
          flutter_rust_bridge_codegen generate \
            --config-file crates/orbit-flutter/flutter_rust_bridge.yaml
          # 生成物入库前统一经 rustfmt（与仓库内已格式化的 frb_generated.rs 对齐）
          cargo fmt --all
          git diff --exit-code apps/mobile/lib/src/rust crates/orbit-flutter/src/frb_generated.rs \
            || (echo "::error::FRB 生成物与仓库不一致，请本地重新执行 codegen 并运行 cargo fmt 后提交" && exit 1)

      - name: 静态分析
        run: flutter analyze

      - name: 单元测试
        run: flutter test

      # 移动端帧耗时门禁（2026-11-08）：有在线设备/模拟器时真卡 5 场景
      # （sheet_open/menu_morph/list_scroll/view_switch/calendar_page，基线见
      # perf-metrics/mobile-jank-baselines.json）；GitHub 托管 runner 无 KVM
      # 起不了模拟器，脚本以 exit 2 自然跳过——continue-on-error 保绿但日志
      # 可见，自托管 runner 接设备后即自动生效。发版前本地必跑（docs/08）
      - name: 移动端帧耗时门禁（有设备时生效）
        if: always()
        working-directory: ${{ github.workspace }}
        continue-on-error: true
        run: node perf-metrics/mobile-jank.mjs --gate
