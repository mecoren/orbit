name: orbit
description: "Orbit（循迹）移动端 — Flutter 重构版。桌面端为 Tauri（apps/desktop），两端共享 crates/orbit-core。"
publish_to: "none"
version: 0.1.1+2

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # 状态管理（wait-home/mobile 同款：Riverpod 3.x 手动声明，无 codegen）
  flutter_riverpod: ^3.3.0

  # 路由（栈式导航语义：/todo → /todo/tasks → /todo/:id）
  go_router: ^17.3.0

  # 时间格式化（相对时间、zh-CN 本地化）
  intl: ^0.20.0

  # 应用数据目录（FRB base_dir 参数源）
  path_provider: ^2.1.0

  # 文件选择（CSV 导入迁移路径：选 Todoist/TickTick 导出的 CSV 文件）
  file_picker: ^10.3.2

  # 本地通知三件套（Phase 7 平台集成：提醒到期系统通知，无权限静默降级 toast）
  flutter_local_notifications: ^22.3.0
  timezone: ^0.11.1
  flutter_timezone: ^5.1.0

  # 生物识别解锁三件套：指纹闸门（local_auth，要求宿主 Activity 为
  # FragmentActivity）+ 密钥链存储（flutter_secure_storage，Android
  # Keystore 加密；存 encrypted_db_key_bio/biometric_key/nonce 三键）
  local_auth: ^3.0.0
  flutter_secure_storage: ^10.0.0-beta.4

  # ── FRB 桥接（cargokit FFI 插件壳，构建 crates/orbit-flutter）──
  flutter_rust_bridge: 2.12.0
  rust_lib_orbit:
    path: rust_builder
  flutter_slidable: ^4.0.3

  # Android 桌面小组件（#3 存在感链条）：widget 数据快照写入 + 添加引导；
  # 勾选/磁贴交互走原生广播直写 SQLite（无 isolate 依赖，见 TodoWidgetProvider）
  home_widget: ^0.9.3

  # Markdown 描述链接点击跳系统浏览器（官方第一方插件，平台桥接非 UI 库；
  # 与 file_picker/local_auth 同类，不违反「UI 自绘不引库」惯例）
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  # 真机/模拟器 E2E（P2 提醒升级验收：后台闹钟链路）
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
